quarkus.http.root-path=/api
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*

quarkus.log.console.enable=true
quarkus.log.level=INFO
quarkus.log.console.level=INFO

quarkus.http.access-log.enabled=true
quarkus.http.access-log.pattern=common

problem.base-url=http://localhost:8080

mp.jwt.verify.issuer=CPU
smallrye.jwt.sign.key.location=jwt/privateKey.pem
mp.jwt.verify.publickey.location=jwt/publicKey.pem

quarkus.hibernate-orm.schema-management.strategy=drop-and-create

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER}
quarkus.datasource.password=${DB_PASSWORD}

# JDBC URL mapping
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}

# Configuração do SeaweedFS Filer
seaweedfs-api/mp-rest/url=http://localhost:8888