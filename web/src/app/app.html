<mat-sidenav-container class="h-screen w-full bg-gray-50" [hasBackdrop]="false">

  <mat-sidenav #sidenav mode="side" [opened]="true" class="w-64 bg-white border-r">

    <nav class="flex flex-col p-4 gap-2">
      @for (item of itens(); track item.nome) {
        <a mat-button [routerLink]="`/admin/${item.nome}`" routerLinkActive="bg-gray-100 text-blue-600">
          {{ item.label }}
        </a>
      }
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="flex flex-col h-full overflow-hidden">

    <header class="h-18 bg-white flex items-center px-4 shrink-0 shadow-sm z-10 relative">
      <div class="ml-auto">
        <button mat-button>Administrador</button>
      </div>
    </header>

    <main class="flex-1 overflow-auto p-6">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
