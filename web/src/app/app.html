<mat-sidenav-container class="h-screen w-full bg-gray-50" [hasBackdrop]="false">

  <mat-sidenav #sidenav mode="side" [opened]="true" class="w-64 bg-white border-r">
    <nav class="px-2">
      <div class="h-16 pt-2 flex justify-items-center">
        <span class="text-2xl font-bold m-auto"> Painel de Administrador </span>
      </div>
      <mat-accordion multi="true" displayMode="flat">
        @for (secao of secoes(); track secao.label) {
          <mat-expansion-panel [expanded]="secao.aberta" class="!shadow-none !bg-transparent border-none">

            <mat-expansion-panel-header class="!px-4 hover:bg-gray-50 !h-12">
              <mat-panel-title class="flex items-center gap-3 text-gray-700 font-medium">
                <mat-icon class="text-gray-400">{{ secao.icone }}</mat-icon>
                {{ secao.label }}
              </mat-panel-title>
            </mat-expansion-panel-header>

            <div class="flex flex-col gap-1 py-1">
              @for (item of secao.subItens; track item.rota) {
                <a mat-button [routerLink]="Array.isArray(item.rota) ? ['/admin'].concat(item.rota) : ['/admin', item.rota]"
                   routerLinkActive="!bg-blue-50 !text-blue-700 font-semibold"
                   class="!w-full !justify-start !pl-12 !h-10 !text-gray-500 !text-sm">
                  {{ item.label }}
                </a>
              }
            </div>

          </mat-expansion-panel>
        }
      </mat-accordion>
    </nav>
  </mat-sidenav>

  <mat-sidenav-content class="flex flex-col h-full overflow-hidden">

    <header class="h-16 bg-white flex items-center px-4 shrink-0 shadow-sm z-10 relative border-b gap-4">

      <button mat-icon-button (click)="sidenav.toggle()" aria-label="Alternar menu lateral">
        <mat-icon>menu</mat-icon>
      </button>

      <div class="ml-auto">
        <button mat-button [matMenuTriggerFor]="userMenu" class="flex items-center gap-2">
          <mat-icon>account_circle</mat-icon> Administrador
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item (click)="sair()">
            <mat-icon>logout</mat-icon>
            <span>Sair do Sistema</span>
          </button>
        </mat-menu>
      </div>
    </header>

    <main class="flex-1 overflow-auto bg-gray-50">
      <router-outlet></router-outlet>
    </main>

  </mat-sidenav-content>

</mat-sidenav-container>
