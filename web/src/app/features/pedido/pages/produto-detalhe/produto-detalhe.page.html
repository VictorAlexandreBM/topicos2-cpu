<div class="min-h-screen bg-gray-50 py-8">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <div class="mb-6">
      <a mat-button routerLink="/" class="text-gray-600">
        <mat-icon>arrow_back</mat-icon> Voltar para a Vitrine
      </a>
    </div>

    @if (carregando()) {
      <div class="flex justify-center items-center min-h-[500px]">
        <mat-spinner diameter="50"></mat-spinner>
      </div>
    }
    @else if (erro() || !cpu()) {
      <div class="flex flex-col justify-center items-center min-h-[500px] text-center bg-white rounded-lg shadow-sm border border-gray-200 p-8">
        <mat-icon class="!w-16 !h-16 !text-6xl text-red-400 mb-4">error_outline</mat-icon>
        <h2 class="text-2xl font-bold text-gray-900">Produto não encontrado</h2>
        <p class="text-gray-500 mt-2">A CPU que você está procurando pode ter sido removida ou o link é inválido.</p>
        <a mat-flat-button color="primary" routerLink="/" class="mt-6">Voltar para a Loja</a>
      </div>
    }
    @else {
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-12 gap-8">

        <div class="lg:col-span-7">
          <app-produto-galeria [cpu]="cpu()!"></app-produto-galeria>
        </div>

        <div class="lg:col-span-5">
          <app-produto-info [cpu]="cpu()!"></app-produto-info>
        </div>

      </div>

      <app-produto-specs [cpu]="cpu()!"></app-produto-specs>
    }

  </div>
</div>
