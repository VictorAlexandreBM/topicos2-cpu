<form (ngSubmit)="tecnologiaEmEdicao() ? atualizar() : cadastrar()" [formGroup]="tecnologiaForm" class="flex flex-col h-full">
  <div [class]="inDrawer() ? 'flex flex-col gap-4 p-4' : 'grid grid-cols-3 gap-6'">
    <div class="">
      <mat-form-field>
        <mat-label>Nome</mat-label>
        <input matInput formControlName="nome" />
        <mat-error>{{ nomeCtrl.errors |  fieldError:nomeCtrl.touched }}</mat-error>
      </mat-form-field>
    </div>

    <div [class]="inDrawer() ? '' : 'col-span-2'">
      <mat-form-field [class]="inDrawer() ? 'w-[100%]' : ''">
        <mat-label>Descrição</mat-label>
        <input matInput formControlName="descricao" />
        <mat-error>{{ descricaoCtrl.errors |  fieldError:descricaoCtrl.touched }}</mat-error>
      </mat-form-field>
    </div>

    <div class="flex justify-end gap-2 mt-auto pt-4 border-t">
      <button type="button" (click)="redefinir()" mat-stroked-button>Cancelar</button>
      <button type="submit" mat-flat-button [color]="tecnologiaEmEdicao() ? 'secondary' : 'primary' " [disabled]="tecnologiaForm.invalid">
        {{ tecnologiaEmEdicao() ? 'Atualizar' : 'Adicionar' }}
      </button>
    </div>

  </div>

</form>
