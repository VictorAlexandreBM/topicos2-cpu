<form (ngSubmit)="cadastrar()" [formGroup]="tecnologiaForm" class="flex flex-col h-full">
  <div class="px-6 py-4 border-b flex justify-between items-center bg-white sticky top-0 z-20">
    <h2 class="text-xl font-semibold text-gray-800">Cadastrar Tecnologia</h2>
    <button mat-icon-button (click)="fechar.emit(true)">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <div [class]="inDrawer() ? 'flex flex-col gap-4 p-4' : 'grid grid-cols-3 gap-6'">
    <div class="">
      <mat-form-field>
        <mat-label>Nome</mat-label>
        <input matInput formControlName="nome" />
        <mat-error>{{ nomeCtrl.errors |  fieldError:nomeCtrl.touched }}</mat-error>
      </mat-form-field>
    </div>

    <div [class]="inDrawer() ? '' : 'col-span-2'">
      <mat-form-field [class]="inDrawer() ? 'w-[100%]' : ''">
        <mat-label>Descrição</mat-label>
        <input matInput formControlName="descricao" />
        <mat-error>{{ descricaoCtrl.errors |  fieldError:descricaoCtrl.touched }}</mat-error>
      </mat-form-field>
    </div>

    <div class="flex justify-end gap-2 mt-auto pt-4 border-t">
      <button type="reset" mat-stroked-button>Cancelar</button>
      <button type="submit" mat-flat-button color="primary" [disabled]="tecnologiaForm.invalid">
        Adicionar
      </button>
    </div>

  </div>

</form>
