<table mat-table [dataSource]="tecnologias()">

  <ng-container matColumnDef="nome">
    <th mat-header-cell *matHeaderCellDef> Nome </th>
    <td mat-cell *matCellDef="let e"> {{e.nome}} </td>
  </ng-container>

  <ng-container matColumnDef="descricao">
    <th mat-header-cell *matHeaderCellDef> Descrição </th>
    <td mat-cell *matCellDef="let e"> {{e.descricao}} </td>
  </ng-container>

  <ng-container matColumnDef="acao">
    <th mat-header-cell *matHeaderCellDef class=""> Ação </th>
    <td mat-cell *matCellDef="let e" class="flex justify-center gap-4 ">
      <button matFab (click)="emitirEdicao(e)">
        <mat-icon>
          {{ tecnologiaEmEdicao()?.id === e.id ? 'close' : 'edit' }}
        </mat-icon>
      </button>
      <button matFab (click)="deletar(e)">
        <mat-icon>delete</mat-icon>
      </button>
    </td>

  </ng-container>



  <tr mat-header-row *matHeaderRowDef="colunas"></tr>
  <tr
    mat-row
    *matRowDef="let row; columns: colunas;"
    [class]="tecnologiaEmEdicao()?.id === row.id ? '!bg-yellow-100' : '' "
  ></tr>

</table>
