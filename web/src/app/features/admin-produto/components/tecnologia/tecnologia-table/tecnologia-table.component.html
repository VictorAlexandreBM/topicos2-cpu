<div class="mat-elevation-z8 relative">

  <table mat-table [dataSource]="tecnologias()">

    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef> Nome </th>
      <td mat-cell *matCellDef="let e"> {{e.nome}} </td>
    </ng-container>

    <ng-container matColumnDef="descricao">
      <th mat-header-cell *matHeaderCellDef> Descrição </th>
      <td mat-cell *matCellDef="let e"> {{e.descricao}} </td>
    </ng-container>

    <ng-container matColumnDef="acao">
      <th mat-header-cell *matHeaderCellDef class="w-[160px] text-center"> Ações </th>

      <td mat-cell *matCellDef="let e" class="text-center whitespace-nowrap">

        <button mat-icon-button color="primary" (click)="emitirEdicao(e)">
          <mat-icon>
            {{ tecnologiaEmEdicao()?.id === e.id ? 'close' : 'edit' }}
          </mat-icon>
        </button>

        <button mat-icon-button (click)="alterarEstado(e, !e.ativo)">
          <mat-icon> {{ e.ativo ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>

        <button mat-icon-button color="warn" (click)="deletar(e)">
          <mat-icon>delete</mat-icon>
        </button>

      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: colunas;"
      [class]="tecnologiaEmEdicao()?.id === row.id ? '!bg-yellow-100' : '' "
    ></tr>
  </table>

  <mat-paginator
    [length]="total()"
    [pageSize]="10"
    [pageSizeOptions]="[5,10,20]"
    showFirstLastButtons
    (page)="paginar($event)"
  ></mat-paginator>

  @if (estaCarregando()) {
    <div class="absolute inset-0 bg-white/60 z-50 flex items-center justify-center">
      <mat-progress-spinner mode="indeterminate" diameter="50" color="primary"></mat-progress-spinner>
    </div>
  }
</div>
