<mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
  <mat-label>Tecnologias</mat-label>
  <mat-select [formControl]="control()" multiple>
    <mat-option>
      <ngx-mat-select-search
        [formControl]="filtroCtrl"
        placeholderLabel="Pesquisar tecnologia..."
        noEntriesFoundLabel="Nenhuma tecnologia encontrada">
      </ngx-mat-select-search>
    </mat-option>

    @for (t of tecnologiasFiltradas(); track t.id) {
      <mat-option [value]="t.id">{{ t.nome }}</mat-option>
    }
  </mat-select>
</mat-form-field>
