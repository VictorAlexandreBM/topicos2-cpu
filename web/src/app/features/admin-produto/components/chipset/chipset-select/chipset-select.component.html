<mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
  <mat-label>Chipsets Compatíveis</mat-label>
  <mat-select [formControl]="control()" multiple>
    <mat-option>
      <ngx-mat-select-search
        [formControl]="filtroCtrl"
        placeholderLabel="Pesquisar chipsets..."
        noEntriesFoundLabel="Nenhuma chipsets encontrada">
      </ngx-mat-select-search>
    </mat-option>

    @for (c of chipsetsFiltrados(); track c.id) {
      <mat-option [value]="c.id">{{ c.tipo }}</mat-option>
    }
  </mat-select>
</mat-form-field>
