<div class="flex flex-col bg-white rounded-lg overflow-hidden">
  <div class="px-6 py-4 flex justify-between items-center border-b border-gray-100 bg-gray-50">
    <h2 class="text-xl font-semibold text-gray-800 m-0">
      {{ chipsetEmEdicao ? "Atualizar Chipset" : "Cadastrar Chipset" }}
    </h2>
    <button mat-icon-button type="button" (click)="fechar()" class="text-gray-500 hover:bg-gray-200">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <form (ngSubmit)="chipsetEmEdicao ? atualizar() : cadastrar()" [formGroup]="chipsetForm" class="flex flex-col p-6">
    <div class="flex flex-col gap-4">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Tipo</mat-label>
        <input matInput formControlName="tipo" placeholder="Ex: X670E" />
        <mat-error>{{ tipoCtrl.errors | fieldError:tipoCtrl.touched }}</mat-error>
      </mat-form-field>
    </div>
    <div class="flex justify-end gap-3 mt-8 pt-4 border-t border-gray-100">
      <button type="button" (click)="fechar()" mat-button class="text-gray-600">Cancelar</button>
      <button type="submit" mat-flat-button color="primary" [disabled]="chipsetForm.invalid" class="px-6">
        {{ chipsetEmEdicao ? 'Atualizar' : 'Salvar' }}
      </button>
    </div>
  </form>
</div>
