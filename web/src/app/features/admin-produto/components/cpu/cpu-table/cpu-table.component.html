<div class="mat-elevation-z8 relative">

  <table mat-table [dataSource]="cpus()" matSort (matSortChange)="ordenar($event)">

    <ng-container matColumnDef="acao">
      <th mat-header-cell *matHeaderCellDef class="w-[160px] text-center"> Ações </th>
      <td mat-cell *matCellDef="let e" class="text-center whitespace-nowrap">
        <button mat-icon-button color="primary" [routerLink]="['/admin/cpu/editar', e.id]">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button (click)="alterarEstadoVenda(e, !e.emVenda)">
          <mat-icon [color]="e.emVenda ? 'primary' : 'warn'">
            {{ e.emVenda ? 'shopping_cart' : 'remove_shopping_cart' }}
          </mat-icon>
        </button>

        <button mat-icon-button color="warn" (click)="deletar(e)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <ng-container matColumnDef="sku">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> SKU </th>
      <td mat-cell *matCellDef="let e"> {{e.sku}} </td>
    </ng-container>

    <ng-container matColumnDef="nomeComercial">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Nome Comercial </th>
      <td mat-cell *matCellDef="let e"> {{e.nomeComercial || '-'}} </td>
    </ng-container>

    <ng-container matColumnDef="nomeModelo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Modelo </th>
      <td mat-cell *matCellDef="let e"> {{e.nomeModelo}} </td>
    </ng-container>

    <ng-container matColumnDef="marca">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Marca </th>
      <td mat-cell *matCellDef="let e"> {{e.marca}} </td>
    </ng-container>

    <ng-container matColumnDef="preco">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Preço </th>
      <td mat-cell *matCellDef="let e"> {{e.preco | currency:'BRL'}} </td>
    </ng-container>

    <ng-container matColumnDef="estoque">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Estoque </th>
      <td mat-cell *matCellDef="let e" [ngClass]="{'text-warn font-bold': e.estoque <= 5}">
        {{e.estoque}}
      </td>
    </ng-container>

    <ng-container matColumnDef="tipo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Tipo </th>
      <td mat-cell *matCellDef="let e">
        <span class="px-2 py-1 rounded text-xs font-medium"
              [ngClass]="e.tipo === 'BOX' ? 'bg-blue-100 text-blue-700' : 'bg-gray-100 text-gray-700'">
          {{e.tipo}}
        </span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr mat-row *matRowDef="let row; columns: colunas;" [ngClass]="{'opacity-50 grayscale': !row.emVenda}"></tr>
  </table>

  <mat-paginator
    [length]="total()"
    [pageSize]="10"
    [pageSizeOptions]="[5,10,20]"
    showFirstLastButtons
    (page)="paginar($event)"
  ></mat-paginator>

  @if (estaCarregando()) {
    <div class="absolute inset-0 bg-white/60 z-50 flex items-center justify-center">
      <mat-progress-spinner mode="indeterminate" diameter="50" color="primary"></mat-progress-spinner>
    </div>
  }
</div>
