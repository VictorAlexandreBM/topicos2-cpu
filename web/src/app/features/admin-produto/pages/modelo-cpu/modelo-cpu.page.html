<div class="p-6 h-full flex flex-col">

  <div class="mb-6 pb-4 border-b border-gray-200 flex justify-between items-start flex-wrap gap-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Gerência de Modelos de CPU</h1>
      <p class="text-sm text-gray-500 mt-1">Liste e gerencie os modelos de processadores com filtros avançados.</p>
    </div>

    <button mat-flat-button color="primary" class="shrink-0 h-[48px]" (click)="novoModelo()">
      <mat-icon>add</mat-icon> Adicionar Modelo
    </button>
  </div>

  <app-modelo-cpu-filtro (filtrosMudaram)="handleFiltros($event)" />

  <app-modelo-cpu-table
    [modelos]="modelosResponse()?.dados ?? []"
    [total]="modelosResponse()?.total ?? 0"
    [estaCarregando]="estaCarregando()"
    (mudancaPagina)="handleMudancaPagina($event)"
    (mudancaOrdem)="handleMudancaOrdem($event)"
    (modeloDeletado)="handleDelecao()"
    (modeloAlteradoEstado)="handleEstadoAlterado()"
  />
</div>
