<div class="p-6 h-full flex flex-col">

  <div class="mb-6 pb-4 border-b border-gray-200">
    <h1 class="text-2xl font-bold text-gray-900">Gerência de Marcas</h1>
    <p class="text-sm text-gray-500 mt-1">Gerencie as marcas fabricantes para o catálogo de CPUs (ex: Intel, AMD).</p>
  </div>

  <div class="flex items-center gap-4 mb-4">
    <app-marca-filtro
      class="w-[550px]"
      (filtroAlterado)="handlePesquisa($event)"
      (mostrarInativos)="handleMostrarInativos($event)"/>
  </div>

  <div class="flex items-center gap-4 mb-4">
    <button mat-flat-button color="primary" class="shrink-0 h-[48px]" (click)="abrirFormulario()">
      <mat-icon>add</mat-icon> Adicionar Marca
    </button>
  </div>

  <app-marca-table
    [marcas]="marcasResponse()?.dados ?? []"
    [total]="marcasResponse()?.total ?? 0"
    [marcaEmEdicao]="marcaEmEdicao()"
    [estaCarregando]="estaCarregando()"
    (mudancaPagina)="handleMudancaPagina($event)"
    (mudancaOrdem)="handleMudancaOrdem($event)"
    (marcaDeletada)="handleDelecao($event)"
    (marcaEditada)="handleEdicao($event)"
    (marcaAlteradaEstado)="handleEstadoAlterado($event)"/>
</div>
