<mat-drawer-container class="example-container relative" [hasBackdrop]="false">
  <mat-drawer #drawer mode="over" position="end" [disableClose]="true">
    <app-tecnologia-form [inDrawer]="true" (fechar)="drawer.close()" />
  </mat-drawer>
  <mat-drawer-content>

    <div class="fixed bottom-10 right-20">
      <button
        mat-fab
        color="primary"
        class="z-10"
        (click)="drawer.open()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
    @if (tecnologiasResponse(); as tecnologias) {
      <app-tecnologia-table [tecnologias]="tecnologias" />

    }

  </mat-drawer-content>
</mat-drawer-container>
