<div class="p-6 h-full flex flex-col">

  <div class="mb-6 pb-4 border-b border-gray-200">
    <h1 class="text-2xl font-bold text-gray-900">Gerência de CPUs</h1>
    <p class="text-sm text-gray-500 mt-1">Controle o estoque e a disponibilidade das CPUs Intel e AMD.</p>
  </div>

  <div class="flex items-center gap-4 mb-4">
    <app-cpu-filtro
      class="w-[550px]"
      (filtroAlterado)="handlePesquisa($event)"
      (mostrarIndisponiveis)="handleMostrarIndisponiveis($event)"/>
  </div>

  <div class="flex items-center gap-4 mb-4">
    <button mat-flat-button color="primary" class="shrink-0 h-[48px]" (click)="novoCpu()">
      <mat-icon>add</mat-icon> Adicionar CPU
    </button>
  </div>

  <app-cpu-table
    [cpus]="cpusResponse()?.dados ?? []"
    [total]="cpusResponse()?.total ?? 0"
    [estaCarregando]="estaCarregando()"
    (mudancaPagina)="handleMudancaPagina($event)"
    (mudancaOrdem)="handleMudancaOrdem($event)"
    (cpuDeletado)="handleRefresh()"
    (cpuAlteradoEstado)="handleRefresh()"
  />
</div>
